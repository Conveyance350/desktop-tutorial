<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D部品設計</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Meiryo UI",Meiryo,sans-serif;font-size:18px;color:#333333;background:#FFFFFF;line-height:1.4}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid #7F7F7F}
h1{font-size:26px;margin:0}
h2{font-size:20px;margin:0 0 8px 0;padding-bottom:4px;border-bottom:1px solid #7F7F7F}
.nameBox{display:flex;align-items:center;gap:8px;flex:1 1 240px;min-width:0}
.nameBox label{white-space:nowrap}
main{display:grid;grid-template-columns:330px minmax(0,1fr) 350px;gap:14px;padding:14px}
section{min-width:0}
.blk{margin-bottom:18px}
input,select,button{font-family:inherit;font-size:20px;color:#333333}
input[type=number],input[type=text],select{width:100%;min-width:0;height:48px;padding:4px 8px;border:2px solid #7F7F7F;background:#FFFFFF;border-radius:0}
button{min-height:52px;padding:6px 6px;font-size:18px;border:2px solid #7F7F7F;background:#FFFFFF;font-weight:bold;cursor:pointer;border-radius:0}
button:disabled{color:#7F7F7F;cursor:default}
button.pri{background:#2F5597;border-color:#2F5597;color:#FFFFFF;font-size:24px;min-height:64px;width:100%}
button.pri:disabled{background:#7F7F7F;border-color:#7F7F7F;color:#FFFFFF}
button.on{background:#2F5597;border-color:#2F5597;color:#FFFFFF}
button.del{border-color:#C00000;color:#C00000}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld label{display:block;font-size:16px;color:#333333}
.sub{font-size:16px;font-weight:bold;margin:12px 0 4px 0}
.note{font-size:15px;color:#7F7F7F;margin:6px 0}
#partList button{display:block;width:100%;text-align:left;margin-bottom:6px;font-weight:normal}
#partList button.on{font-weight:bold}
#viewWrap{position:relative;width:100%;height:60vh;min-height:320px;border:2px solid #7F7F7F;overflow:hidden;background:#FFFFFF}
#gl{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#labels span{position:absolute;font-size:16px;font-weight:bold;color:#7F7F7F;transform:translate(-50%,-50%)}
#noGl{position:absolute;left:0;top:0;width:100%;padding:16px;color:#C00000;font-weight:bold;display:none}
#busy{position:absolute;right:8px;top:6px;font-size:15px;color:#7F7F7F}
.viewBtns{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:8px 0}
.viewBtns button{min-height:48px;font-size:17px;padding:4px 2px}
#result{background:#F2F2F2;padding:10px 12px;margin:8px 0 14px 0}
#dims{font-size:18px}
#dims b{font-size:36px;color:#2F5597}
#judge{font-size:20px;font-weight:bold;margin-top:4px}
.ok{color:#548235}
.ng{color:#C00000}
#msg{min-height:28px;margin-top:8px;font-weight:bold}
#editor .empty{color:#7F7F7F}
#edTitle{font-size:22px;font-weight:bold;margin-bottom:8px}
@media (max-width:1000px){
 main{grid-template-columns:minmax(0,1fr);padding:10px}
 #colC{order:1}#colL{order:2}#colR{order:3}
 #viewWrap{height:340px}
 .viewBtns{grid-template-columns:repeat(4,minmax(0,1fr))}
 #dims b{font-size:30px}
}
</style>
</head>
<body>
<header>
 <h1>3D部品設計</h1>
 <div class="nameBox"><label for="partName">部品名</label><input type="text" id="partName" maxlength="40"></div>
</header>
<main>
<section id="colL">
 <div class="blk">
  <h2>1. 形を追加する</h2>
  <div class="g3" id="typeBtns"></div>
  <div class="sub">見本から始める</div>
  <div class="g2"><select id="presetSel"></select><button type="button" id="btnPreset">見本を開く</button></div>
 </div>
 <div class="blk">
  <h2>部品リスト</h2>
  <div id="partList"></div>
  <div class="g2"><button type="button" id="btnUndo">元に戻す</button><button type="button" id="btnClear" class="del">全て消す</button></div>
 </div>
 <div class="blk">
  <h2>設計ファイル</h2>
  <div class="g2"><button type="button" id="btnSave">ファイルに保存</button><button type="button" id="btnOpen">ファイルを開く</button></div>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  <div class="sub">プリンターの造形サイズ（mm）</div>
  <div class="g3">
   <div class="fld"><label for="bedX">幅 X</label><input type="number" id="bedX" inputmode="decimal"></div>
   <div class="fld"><label for="bedY">奥行 Y</label><input type="number" id="bedY" inputmode="decimal"></div>
   <div class="fld"><label for="bedZ">高さ Z</label><input type="number" id="bedZ" inputmode="decimal"></div>
  </div>
 </div>
</section>
<section id="colC">
 <div id="viewWrap">
  <canvas id="gl"></canvas>
  <div id="labels"><span id="lblX">X</span><span id="lblY">Y</span><span id="lblZ">Z</span></div>
  <div id="noGl">NG：この端末では3D表示ができません。寸法入力とSTL出力は使えます。</div>
  <div id="busy"></div>
 </div>
 <div class="viewBtns">
  <button type="button" id="vIso">斜め</button>
  <button type="button" id="vFront">正面</button>
  <button type="button" id="vSide">横</button>
  <button type="button" id="vTop">上</button>
  <button type="button" id="vFit">全体</button>
  <button type="button" id="vIn">拡大</button>
  <button type="button" id="vOut">縮小</button>
 </div>
 <div class="note">ドラッグ：回す　／　右ドラッグ・Shift＋ドラッグ・2本指：移動　／　ホイール・2本指：拡大縮小</div>
 <div id="result">
  <div id="dims"></div>
  <div id="judge"></div>
 </div>
 <div class="blk">
  <h2>3. STLを出力する</h2>
  <div class="fld"><label for="resSel">出力の細かさ</label><select id="resSel"></select></div>
  <div style="margin-top:8px"><button type="button" id="btnStl" class="pri">STLを出力</button></div>
  <div id="msg"></div>
 </div>
</section>
<section id="colR">
 <h2>2. 選んだ形の寸法（mm）</h2>
 <div id="editor"></div>
</section>
</main>
<script>
(function(){
'use strict';
var KEY='3D部品設計_data';
//CORE-START
var TYPES={
 box:{name:'直方体',f:[['w','幅 X',40,0.1,500],['d','奥行 Y',30,0.1,500],['h','高さ Z',10,0.1,500],['r','角の丸み R',0,0,250]],hint:'位置は底面の中心。角の丸みは上から見た四隅に付きます。'},
 cyl:{name:'円柱',f:[['dia','直径',20,0.1,500],['h','高さ Z',20,0.1,500]],hint:'位置は底面の中心。「削る」にすると丸穴になります。'},
 pipe:{name:'パイプ',f:[['od','外径',30,0.5,500],['id','内径',24,0.1,499],['h','高さ Z',20,0.1,500]],hint:'位置は底面の中心。'},
 bend:{name:'曲げ板',f:[['ri','内側の半径',20,0.1,500],['t','板厚',3,0.1,200],['a','角度（度）',90,1,360],['h','幅 Z',20,0.1,500]],hint:'位置は曲げの中心（円弧の中心）。X方向から反時計回りに曲がります。'},
 ring:{name:'丸棒曲げ',f:[['dc','曲げの中心径',30,0.1,500],['t','丸棒の太さ',6,0.1,200],['a','角度（度）',360,1,360]],hint:'位置は曲げの中心。360度でリング、180度でU字フックになります。'},
 sphere:{name:'球',f:[['dia','直径',20,0.1,500]],hint:'位置は球の一番下の点。'},
 cone:{name:'円すい台',f:[['d1','下の直径',20,0,500],['d2','上の直径',10,0,500],['h','高さ Z',15,0.1,500]],hint:'位置は底面の中心。上の直径を0にすると円すいになります。'},
 hex:{name:'六角柱',f:[['s','二面幅',10,0.1,500],['h','高さ Z',5,0.1,500]],hint:'位置は底面の中心。「削る」でナットの入る穴になります。'},
 wedge:{name:'くさび',f:[['w','幅 X',20,0.1,500],['d','奥行 Y',5,0.1,500],['h','高さ Z',20,0.1,500]],hint:'位置は底面の中心。X方向に向かって低くなる三角形（補強リブ用）。'}
};
var ORDER=['box','cyl','pipe','bend','ring','sphere','cone','hex','wedge'];
var MAXPARTS=60;
var EDGES=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];

function num(v,def,min,max){
 if(v===null||v===''||typeof v==='boolean'||typeof v==='object'||typeof v==='undefined') return def;
 v=Number(v);
 if(!isFinite(v)) return def;
 if(v<min) v=min;
 if(v>max) v=max;
 return Math.round(v*1000)/1000;
}
function newPart(type){
 var T=TYPES[type],p={},i;
 for(i=0;i<T.f.length;i++) p[T.f[i][0]]=T.f[i][2];
 return {type:type,sub:false,p:p,x:0,y:0,z:0,rx:0,ry:0,rz:0,cut:0,cutPos:0,shell:0};
}
function sanitizePart(o){
 if(!o||typeof o!=='object'||!Object.prototype.hasOwnProperty.call(TYPES,o.type)) return null;
 var T=TYPES[o.type],src=(o.p&&typeof o.p==='object')?o.p:{},p={},i,f;
 for(i=0;i<T.f.length;i++){f=T.f[i];p[f[0]]=num(src[f[0]],f[2],f[3],f[4]);}
 if(o.type==='pipe'&&p.id>p.od-0.4) p.id=Math.max(0.1,Math.round((p.od-0.4)*1000)/1000);
 var ct=Math.round(Number(o.cut));
 if(!isFinite(ct)||ct<-3||ct>3||typeof o.cut==='boolean'||o.cut===null) ct=0;
 return {type:o.type,sub:o.sub===true,p:p,cut:ct,cutPos:num(o.cutPos,0,-500,500),shell:num(o.shell,0,0,100),
  x:num(o.x,0,-500,500),y:num(o.y,0,-500,500),z:num(o.z,0,-500,500),
  rx:num(o.rx,0,-360,360),ry:num(o.ry,0,-360,360),rz:num(o.rz,0,-360,360)};
}
function sanitizeParts(a){
 var out=[],i,p;
 if(!Array.isArray(a)) return out;
 for(i=0;i<a.length&&out.length<MAXPARTS;i++){p=sanitizePart(a[i]);if(p)out.push(p);}
 return out;
}
function ext(d2,z,H){
 var dz=Math.abs(z-H/2)-H/2,a=d2>0?d2:0,b=dz>0?dz:0;
 return Math.min(Math.max(d2,dz),0)+Math.sqrt(a*a+b*b);
}
function sector(x,y,A){
 if(A>=360) return -1e9;
 var hf=A*Math.PI/360,c=Math.cos(hf),s=Math.sin(hf);
 var px=x*c+y*s,py=Math.abs(-x*s+y*c);
 return -px*s+py*c;
}
function makeFn(type,p){
 var a,b,c,e;
 switch(type){
 case 'box':
  a=p.w/2;b=p.d/2;c=Math.min(p.r,a,b);
  return {box:[-a,a,-b,b,0,p.h],f:function(x,y,z){
   var qx=Math.abs(x)-a+c,qy=Math.abs(y)-b+c,mx=qx>0?qx:0,my=qy>0?qy:0;
   return ext(Math.sqrt(mx*mx+my*my)+Math.min(Math.max(qx,qy),0)-c,z,p.h);}};
 case 'cyl':
  a=p.dia/2;
  return {box:[-a,a,-a,a,0,p.h],f:function(x,y,z){return ext(Math.sqrt(x*x+y*y)-a,z,p.h);}};
 case 'pipe':
  a=p.od/2;b=Math.min(p.id/2,a-0.2);if(b<0)b=0;
  return {box:[-a,a,-a,a,0,p.h],f:function(x,y,z){var r=Math.sqrt(x*x+y*y);return ext(Math.max(r-a,b-r),z,p.h);}};
 case 'bend':
  a=p.ri+p.t/2;b=p.t/2;c=p.ri+p.t;
  return {box:[-c,c,-c,c,0,p.h],f:function(x,y,z){
   var r=Math.sqrt(x*x+y*y);
   return ext(Math.max(Math.abs(r-a)-b,sector(x,y,p.a)),z,p.h);}};
 case 'ring':
  a=p.dc/2;b=p.t/2;c=a+b;
  return {box:[-c,c,-c,c,0,p.t],f:function(x,y,z){
   var q=Math.sqrt(x*x+y*y)-a,zz=z-b;
   return Math.max(Math.sqrt(q*q+zz*zz)-b,sector(x,y,p.a));}};
 case 'sphere':
  a=p.dia/2;
  return {box:[-a,a,-a,a,0,p.dia],f:function(x,y,z){var zz=z-a;return Math.sqrt(x*x+y*y+zz*zz)-a;}};
 case 'cone':
  a=p.d1/2;b=p.d2/2;c=p.h/2;e=Math.max(a,b);
  return {box:[-e,e,-e,e,0,p.h],f:function(x,y,z){
   var qx=Math.sqrt(x*x+y*y),qy=z-c;
   var k2x=b-a,k2y=2*c;
   var cax=qx-Math.min(qx,qy<0?a:b),cay=Math.abs(qy)-c;
   var t=((b-qx)*k2x+(c-qy)*k2y)/(k2x*k2x+k2y*k2y);
   if(t<0)t=0;if(t>1)t=1;
   var cbx=qx-b+k2x*t,cby=qy-c+k2y*t;
   var s=(cbx<0&&cay<0)?-1:1;
   return s*Math.sqrt(Math.min(cax*cax+cay*cay,cbx*cbx+cby*cby));}};
 case 'hex':
  a=p.s/2;b=a/0.8660254;
  return {box:[-b,b,-a,a,0,p.h],f:function(x,y,z){
   var ax=Math.abs(x),ay=Math.abs(y);
   return ext(Math.max(ax*0.8660254+ay*0.5,ay)-a,z,p.h);}};
 default:
  a=p.w/2;b=p.d/2;c=Math.sqrt(p.h*p.h+p.w*p.w);
  return {box:[-a,a,-b,b,0,p.h],f:function(x,y,z){
   var sl=((x+a)*p.h+(z-p.h)*p.w)/c;
   return Math.max(Math.abs(y)-b,-z,-(x+a),sl);}};
 }
}
function applyWork(m,part){
 var f0=m.f,bx=m.box.slice(),t=part.shell,ct=part.cut,f1=f0;
 if(t>0) f1=function(x,y,z){var v=f0(x,y,z);return Math.max(v,-(v+t));};
 if(!ct) return {f:f1,box:bx};
 var ax=Math.abs(ct)-1,sg=ct>0?1:-1,lo=bx[ax*2],hi=bx[ax*2+1],at=(lo+hi)/2+part.cutPos;
 if(at<lo)at=lo;if(at>hi)at=hi;
 if(sg>0)bx[ax*2]=at;else bx[ax*2+1]=at;
 return {box:bx,f:function(x,y,z){
  var v=f1(x,y,z),c=(ax===0?x:(ax===1?y:z)),pl=-sg*(c-at);
  return v>pl?v:pl;}};
}
function compileOne(part){
 var m=applyWork(makeFn(part.type,part.p),part),D=Math.PI/180;
 var cx=Math.cos(part.rx*D),sx=Math.sin(part.rx*D),cy=Math.cos(part.ry*D),sy=Math.sin(part.ry*D),cz=Math.cos(part.rz*D),sz=Math.sin(part.rz*D);
 var R=[cz*cy,cz*sy*sx-sz*cx,cz*sy*cx+sz*sx, sz*cy,sz*sy*sx+cz*cx,sz*sy*cx-cz*sx, -sy,cy*sx,cy*cx];
 var bx=m.box,corners=[],n,lx,ly,lz;
 for(n=0;n<8;n++){
  lx=bx[n&1];ly=bx[2+((n>>1)&1)];lz=bx[4+((n>>2)&1)];
  corners.push([R[0]*lx+R[1]*ly+R[2]*lz+part.x,R[3]*lx+R[4]*ly+R[5]*lz+part.y,R[6]*lx+R[7]*ly+R[8]*lz+part.z]);
 }
 var mx=(bx[0]+bx[1])/2,my=(bx[2]+bx[3])/2,mz=(bx[4]+bx[5])/2;
 var hx=(bx[1]-bx[0])/2,hy=(bx[3]-bx[2])/2,hz=(bx[5]-bx[4])/2;
 return {sub:part.sub,f:m.f,R:R,tx:part.x,ty:part.y,tz:part.z,corners:corners,
  cx:R[0]*mx+R[1]*my+R[2]*mz+part.x,cy:R[3]*mx+R[4]*my+R[5]*mz+part.y,cz:R[6]*mx+R[7]*my+R[8]*mz+part.z,
  br:Math.sqrt(hx*hx+hy*hy+hz*hz)};
}
function compile(parts){
 var add=[],sub=[],i,c;
 for(i=0;i<parts.length;i++){c=compileOne(parts[i]);(c.sub?sub:add).push(c);}
 return {add:add,sub:sub};
}
function makeGrid(cp,h,cap){
 if(!cp.add.length) return null;
 var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9],i,n,a,c;
 for(i=0;i<cp.add.length;i++){
  for(n=0;n<8;n++){c=cp.add[i].corners[n];for(a=0;a<3;a++){if(c[a]<mn[a])mn[a]=c[a];if(c[a]>mx[a])mx[a]=c[a];}}
 }
 var nx,ny,nz,tot,guard=0;
 for(;;){
  nx=Math.ceil((mx[0]-mn[0])/h)+5;ny=Math.ceil((mx[1]-mn[1])/h)+5;nz=Math.ceil((mx[2]-mn[2])/h)+5;
  tot=nx*ny*nz;
  if(tot<=cap||guard++>40) break;
  h*=Math.max(1.03,Math.pow(tot/cap,1/3));
 }
 return {h:h,nx:nx,ny:ny,nz:nz,ox:mn[0]-2*h,oy:mn[1]-2*h,oz:mn[2]-2*h,data:new Float32Array(tot)};
}
function fillSlab(g,cp,k){
 var h=g.h,h2=h*2,nx=g.nx,ny=g.ny,data=g.data,add=cp.add,sub=cp.sub,na=add.length,ns=sub.length;
 var z=g.oz+k*h,idx=k*nx*ny,i,j,a,c,x,y,d,dx,dy,dz,bd,v,R;
 for(j=0;j<ny;j++){
  y=g.oy+j*h;
  for(i=0;i<nx;i++){
   x=g.ox+i*h;d=1e9;
   for(a=0;a<na;a++){
    c=add[a];dx=x-c.cx;dy=y-c.cy;dz=z-c.cz;
    bd=Math.sqrt(dx*dx+dy*dy+dz*dz)-c.br;
    if(bd>h2){if(bd<d)d=bd;continue;}
    R=c.R;dx=x-c.tx;dy=y-c.ty;dz=z-c.tz;
    v=c.f(R[0]*dx+R[3]*dy+R[6]*dz,R[1]*dx+R[4]*dy+R[7]*dz,R[2]*dx+R[5]*dy+R[8]*dz);
    if(v<d)d=v;
   }
   if(d<=h2){
    for(a=0;a<ns;a++){
     c=sub[a];dx=x-c.cx;dy=y-c.cy;dz=z-c.cz;
     bd=Math.sqrt(dx*dx+dy*dy+dz*dz)-c.br;
     if(bd>h2)continue;
     R=c.R;dx=x-c.tx;dy=y-c.ty;dz=z-c.tz;
     v=-c.f(R[0]*dx+R[3]*dy+R[6]*dz,R[1]*dx+R[4]*dy+R[7]*dz,R[2]*dx+R[5]*dy+R[8]*dz);
     if(v>d)d=v;
    }
   }
   data[idx++]=d;
  }
 }
}
function surfaceNets(g){
 var nx=g.nx,ny=g.ny,nz=g.nz,h=g.h,data=g.data,cx=nx-1,cy=ny-1,cz=nz-1,sl=nx*ny;
 var vi=new Int32Array(cx*cy*cz),pos=[],tri=[],cnt=0;
 var off=[0,1,nx,nx+1,sl,sl+1,sl+nx,sl+nx+1],cv=[0,0,0,0,0,0,0,0];
 var i,j,k,n,e,p,mask,sx,sy,sz,ne,a,b,t,ci;
 for(k=0;k<cz;k++)for(j=0;j<cy;j++)for(i=0;i<cx;i++){
  p=i+j*nx+k*sl;mask=0;
  for(n=0;n<8;n++){cv[n]=data[p+off[n]];if(cv[n]<0)mask|=(1<<n);}
  ci=i+j*cx+k*cx*cy;
  if(mask===0||mask===255){vi[ci]=-1;continue;}
  sx=0;sy=0;sz=0;ne=0;
  for(e=0;e<12;e++){
   a=EDGES[e][0];b=EDGES[e][1];
   if(((mask>>a)&1)===((mask>>b)&1))continue;
   t=cv[a]/(cv[a]-cv[b]);
   sx+=(a&1)+((b&1)-(a&1))*t;
   sy+=((a>>1)&1)+(((b>>1)&1)-((a>>1)&1))*t;
   sz+=((a>>2)&1)+(((b>>2)&1)-((a>>2)&1))*t;
   ne++;
  }
  pos.push(g.ox+(i+sx/ne)*h,g.oy+(j+sy/ne)*h,g.oz+(k+sz/ne)*h);
  vi[ci]=cnt++;
 }
 function quad(A,B,C,D,flip){
  if(A<0||B<0||C<0||D<0)return;

 for(v=Math.ceil(-bx/10)*10;v<=bx;v+=10)a.push(v,-by,0,v,by,0);
 for(v=Math.ceil(-by/10)*10;v<=by;v+=10)a.push(-bx,v,0,bx,v,0);
 nBed=a.length/3;
 a.push(-bx,-by,0,bx,-by,0, bx,-by,0,bx,by,0, bx,by,0,-bx,by,0, -bx,by,0,-bx,-by,0);
 nBedOut=8;
 gl.bindBuffer(gl.ARRAY_BUFFER,bufBed);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.STATIC_DRAW);
 var L=30;
 gl.bindBuffer(gl.ARRAY_BUFFER,bufAxis);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-bx,-by,0,-bx+L,-by,0,-bx,-by,0,-bx,-by+L,0,-bx,-by,0,-bx,-by,L]),gl.STATIC_DRAW);
}
function updateSelLines(){
 nSel=0;
 var p=selPart();
 if(!gl||!p)return;
 var c=compileOne(p).corners,a=[],e;
 for(e=0;e<12;e++){a.push(c[EDGES[e][0]][0],c[EDGES[e][0]][1],c[EDGES[e][0]][2],c[EDGES[e][1]][0],c[EDGES[e][1]][1],c[EDGES[e][1]][2]);}
 gl.bindBuffer(gl.ARRAY_BUFFER,bufSel);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(a),gl.DYNAMIC_DRAW);
 nSel=24;
}
function rot(){
 var cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),se=Math.sin(view.el),ce=Math.cos(view.el);
 return [cy,-sy,0, sy*se,cy*se,ce, -sy*ce,-cy*ce,se];
}
function fitView(){
 var W=elWrap.clientWidth||300,H=elWrap.clientHeight||300,mn,mx;
 if(meshBox){mn=meshBox.min;mx=meshBox.max;}
 else{mn=[-state.bed.x/2,-state.bed.y/2,0];mx=[state.bed.x/2,state.bed.y/2,20];}
 var dx=mx[0]-mn[0],dy=mx[1]-mn[1],dz=mx[2]-mn[2],dg=Math.sqrt(dx*dx+dy*dy+dz*dz)||10;
 view.c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
 view.zoom=Math.min(W,H)/(dg*1.25);view.panx=0;view.pany=0;
}
function requestDraw(){
 if(drawQueued)return;drawQueued=true;
 (window.requestAnimationFrame||function(f){return setTimeout(f,16);})(draw);
}
function draw(){
 drawQueued=false;
 var W=elWrap.clientWidth,H=elWrap.clientHeight;
 if(!W||!H)return;
 var R=rot(),c=view.c,bx=state.bed.x/2,by=state.bed.y/2;
 function lab(el,p){
  var dx=p[0]-c[0],dy=p[1]-c[1],dz=p[2]-c[2];
  var X=W/2+(R[0]*dx+R[1]*dy+R[2]*dz)*view.zoom+view.panx,Y=H/2-(R[3]*dx+R[4]*dy+R[5]*dz)*view.zoom+view.pany;
  if(X<8||Y<8||X>W-8||Y>H-8){el.style.display='none';}
  else{el.style.display='block';el.style.left=X+'px';el.style.top=Y+'px';}
 }
 lab($('lblX'),[-bx+38,-by,0]);lab($('lblY'),[-bx,-by+38,0]);lab($('lblZ'),[-bx,-by,38]);
 if(!gl)return;
 var dpr=Math.min(window.devicePixelRatio||1,2),pw=Math.round(W*dpr),ph=Math.round(H*dpr);
 if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
 gl.viewport(0,0,pw,ph);
 gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 var kx=view.zoom*2/W,ky=view.zoom*2/H,D=3000;
 var r0c=R[0]*c[0]+R[1]*c[1]+R[2]*c[2],r1c=R[3]*c[0]+R[4]*c[1]+R[5]*c[2],r2c=R[6]*c[0]+R[7]*c[1]+R[8]*c[2];
 gl.uniformMatrix4fv(loc.uM,false,new Float32Array([
  R[0]*kx,R[3]*ky,-R[6]/D,0, R[1]*kx,R[4]*ky,-R[7]/D,0, R[2]*kx,R[5]*ky,-R[8]/D,0,
  -r0c*kx+2*view.panx/W,-r1c*ky-2*view.pany/H,r2c/D,1]));
 gl.uniformMatrix3fv(loc.uR,false,new Float32Array([R[0],R[3],R[6],R[1],R[4],R[7],R[2],R[5],R[8]]));
 gl.enableVertexAttribArray(loc.aPos);
 function lines(buf,first,count,col){
  if(!count)return;
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,12,0);
  gl.uniform3f(loc.uColor,col[0],col[1],col[2]);
  gl.drawArrays(gl.LINES,first,count);
 }
 if(loc.aNor>=0){gl.disableVertexAttribArray(loc.aNor);gl.vertexAttrib3f(loc.aNor,0,0,1);}
 gl.uniform1f(loc.uLit,0);
 lines(bufBed,0,nBed,[0.86,0.86,0.86]);
 lines(bufBed,nBed,nBedOut,[0.5,0.5,0.5]);
 lines(bufAxis,0,6,[0.2,0.2,0.2]);
 if(nMesh){
  gl.bindBuffer(gl.ARRAY_BUFFER,bufMesh);
  gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,24,0);
  if(loc.aNor>=0){gl.enableVertexAttribArray(loc.aNor);gl.vertexAttribPointer(loc.aNor,3,gl.FLOAT,false,24,12);}
  gl.uniform1f(loc.uLit,1);gl.uniform3f(loc.uColor,0.80,0.82,0.86);
  gl.drawArrays(gl.TRIANGLES,0,nMesh);
  if(loc.aNor>=0){gl.disableVertexAttribArray(loc.aNor);gl.vertexAttrib3f(loc.aNor,0,0,1);}
  gl.uniform1f(loc.uLit,0);
 }
 gl.disable(gl.DEPTH_TEST);
 lines(bufSel,0,nSel,[0.184,0.333,0.592]);
 gl.enable(gl.DEPTH_TEST);
}
function zoomBy(f){
 var z=Math.max(0.05,Math.min(400,view.zoom*f));f=z/view.zoom;
 view.zoom=z;view.panx*=f;view.pany*=f;requestDraw();
}
function setView(yaw,el){view.yaw=yaw;view.el=el;requestDraw();}
var ptrs={},ptrN=0,pinch=null;
function ptrList(){var a=[],k;for(k in ptrs)if(Object.prototype.hasOwnProperty.call(ptrs,k))a.push(ptrs[k]);return a;}
function pinchInfo(){var a=ptrList();return {d:Math.sqrt(Math.pow(a[0].x-a[1].x,2)+Math.pow(a[0].y-a[1].y,2))||1,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};}
function initPointer(){
 cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(er){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY,pan:(e.button===2||e.button===1||e.shiftKey)};
  ptrN=ptrList().length;
  pinch=(ptrN===2)?pinchInfo():null;
 });
 cv.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;
  var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrN===1){
   if(p.pan){view.panx+=dx;view.pany+=dy;}
   else{view.yaw+=dx*0.01;view.el=Math.max(-Math.PI/2,Math.min(Math.PI/2,view.el+dy*0.01));}
   requestDraw();
  }else if(ptrN===2&&pinch){
   var n=pinchInfo();
   view.panx+=n.mx-pinch.mx;view.pany+=n.my-pinch.my;
   zoomBy(Math.pow(n.d/pinch.d,0.6));pinch=n;
  }
 });
 function up(e){
  if(!ptrs[e.pointerId])return;
  delete ptrs[e.pointerId];ptrN=ptrList().length;pinch=(ptrN===2)?pinchInfo():null;
 }
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('wheel',function(e){
  e.preventDefault();
  var d=e.deltaY*(e.deltaMode===1?33:(e.deltaMode===2?300:1));
  if(!isFinite(d))return;
  d=Math.max(-120,Math.min(120,d));
  zoomBy(Math.exp(-d*(e.ctrlKey?0.004:0.0005)));
 },{passive:false});
 cv.addEventListener('contextmenu',function(e){e.preventDefault();});
}

/* ---------- 初期化とボタン ---------- */
function init(){
 load();
 ORDER.forEach(function(t){
  var b=mk('button','',TYPES[t].name);b.type='button';
  b.addEventListener('click',function(){
   if(state.parts.length>=MAXPARTS){setMsg('NG：形は'+MAXPARTS+'個までです。','ng');return;}
   state.parts.push(newPart(t));state.sel=state.parts.length-1;commit();refreshAll();
  });
  elTypeBtns.appendChild(b);
 });
 PRESETS.forEach(function(p,i){var o=mk('option','',p.name);o.value=String(i);elPresetSel.appendChild(o);});
 RES.forEach(function(r){var o=mk('option','',r[1]);o.value=String(r[0]);elRes.appendChild(o);});
 elRes.value=String(state.res);
 elRes.addEventListener('change',function(){state.res=sanitizeState({res:elRes.value}).res;elRes.value=String(state.res);save();});
 elName.value=state.name;
 elName.addEventListener('input',function(){state.name=elName.value.slice(0,40);save();});
 ['x','y','z'].forEach(function(a){
  var el=elBed[a],def=(a==='z')?250:220;
  el.value=String(state.bed[a]);
  el.addEventListener('change',function(){
   state.bed[a]=num(el.value,state.bed[a]||def,10,1000);el.value=String(state.bed[a]);
   save();setBed();showDims(lastStats);requestDraw();
  });
 });
 $('btnPreset').addEventListener('click',function(){
  var p=PRESETS[Number(elPresetSel.value)]||PRESETS[0];
  state.parts=sanitizeParts(p.parts);state.sel=0;state.name=p.name;elName.value=p.name;
  commit();needFit=true;refreshAll();setMsg('見本を開きました（「元に戻す」で戻せます）。','');
 });
 elUndo.addEventListener('click',function(){
  if(!undo.length)return;
  var s=undo.pop(),a=[];
  try{a=JSON.parse(s);}catch(e){a=[];}
  state.parts=sanitizeParts(a);lastSnap=JSON.stringify(state.parts);
  if(state.sel>=state.parts.length)state.sel=Math.max(0,state.parts.length-1);
  save();refreshAll();
 });
 var clearArmed=false,clearTimer=null;
 elClear.addEventListener('click',function(){
  if(!clearArmed){
   clearArmed=true;elClear.textContent='もう一度押す';
   clearTimer=setTimeout(function(){clearArmed=false;elClear.textContent='全て消す';},3000);
   return;
  }
  clearTimeout(clearTimer);clearArmed=false;elClear.textContent='全て消す';
  state.parts=[];state.sel=0;commit();refreshAll();
 });
 $('btnSave').addEventListener('click',function(){
  download(new Blob([JSON.stringify(state)],{type:'application/json'}),safeName()+'.json');
  setMsg('OK：設計ファイルを保存しました。','ok');
 });
 var fileIn=$('fileIn');
 $('btnOpen').addEventListener('click',function(){fileIn.value='';fileIn.click();});
 fileIn.addEventListener('change',function(){
  var f=fileIn.files&&fileIn.files[0];if(!f)return;
  if(f.size>2000000){setMsg('NG：ファイルが大きすぎます。','ng');return;}
  var rd=new FileReader();
  rd.onerror=function(){setMsg('NG：ファイルを読めませんでした。','ng');};
  rd.onload=function(){
   var o=null;
   try{o=JSON.parse(String(rd.result));}catch(e){o=null;}
   if(!o||typeof o!=='object'||!Array.isArray(o.parts)){setMsg('NG：このアプリの設計ファイルではありません。','ng');return;}
   var s=sanitizeState(o);
   state.parts=s.parts;state.sel=s.sel;state.name=s.name;elName.value=s.name;
   commit();needFit=true;refreshAll();setMsg('OK：設計ファイルを開きました。','ok');
  };
  rd.readAsText(f);
 });
 elStl.addEventListener('click',exportSTL);
 $('vIso').addEventListener('click',function(){setView(-0.6,0.5);});
 $('vFront').addEventListener('click',function(){setView(0,0);});
 $('vSide').addEventListener('click',function(){setView(-Math.PI/2,0);});
 $('vTop').addEventListener('click',function(){setView(0,Math.PI/2);});
 $('vFit').addEventListener('click',function(){fitView();requestDraw();});
 $('vIn').addEventListener('click',function(){zoomBy(1.1);});
 $('vOut').addEventListener('click',function(){zoomBy(1/1.1);});
 window.addEventListener('resize',requestDraw);
 initGL();initPointer();setBed();
 elUndo.disabled=true;
 renderList();renderEditor();schedulePreview(0);
}
init();
})();
