<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>指示書照合</title>
<style>
*{box-sizing:border-box}body{font-family:Meiryo,"Yu Gothic",sans-serif;margin:12px;background:#f4f6f8;color:#222}h1{font-size:20px;margin:0 0 10px}.box{background:#fff;border:1px solid #ccc;border-radius:7px;padding:12px;margin-bottom:10px}button{font-size:17px;padding:8px 14px;margin:3px;touch-action:manipulation}#status{font-size:25px;font-weight:bold;padding:14px;border-radius:6px;text-align:center;background:#ddd}.ok{background:#2e9d4a!important;color:#fff}.ng{background:#d62828!important;color:#fff}.skip{background:#777!important;color:#fff}.done{background:#2b6cb0!important;color:#fff}#wait{font-size:15px;font-weight:bold;margin:6px 0}.head{display:flex;gap:12px 20px;flex-wrap:wrap}.head div{font-size:14px}.head span{display:inline-block;min-width:56px;margin-left:5px;padding:3px 8px;font-size:19px;font-weight:bold;background:#eef2f5;border:1px solid #bbb;border-radius:4px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.digit{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#555}.digit button{width:68px;height:44px;padding:0;margin:2px;font-size:20px;user-select:none;-webkit-user-select:none}#totalView{font-size:40px;font-weight:bold;min-width:90px;text-align:center;background:#fff;border:2px solid #333;border-radius:6px;padding:4px 8px}#start{font-size:20px;padding:10px 22px;font-weight:bold}#count{display:flex;gap:20px;align-items:baseline;margin:8px 0}#left{font-size:48px;font-weight:bold}#progress{font-size:21px}#note{font-size:13px;color:#555;margin-top:10px;line-height:1.5}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #999;padding:5px 8px;font-size:16px;text-align:center}#log{font-size:13px;max-height:220px;overflow:auto;font-family:monospace}.bad{color:#c00}
</style></head><body>
<h1>指示書照合（納入かんばん 中央QR）</h1>
<div id="status">指示書の左上QRを読んでください</div><div id="wait"></div><div id="count"><div id="left"></div><div id="progress"></div></div>
<div class="box" id="setup">
 <div class="head"><div>納入先コード<span id="dest">－</span></div><div>納入日<span id="date">－</span></div><div>引取り便<span id="route">－</span></div><div>オーダー<span id="order">未読</span></div><div>受入<span id="uke">－</span></div></div>
 <div class="row"><b>指示書の総箱数</b><div class="digit">十の位<button class="step" data-step="10">＋10</button><button class="step" data-step="-10">－10</button></div><div id="totalView">0</div><div class="digit">一の位<button class="step" data-step="1">＋1</button><button class="step" data-step="-1">－1</button></div><button id="clear">0に戻す</button><button id="start">照合開始</button></div>
 <div id="note">① 指示書の左上QRを読む　② 総箱数を設定　③ 照合開始　④ 中央QRを順不同で読む<br>引取り便とオーダーを別項目として照合します。品番・背番号は照合しません。納入先コードは中央QRとの対応が未確定のため照合条件に含めません。</div>
</div>
<div class="box"><button id="csv">CSV出力</button><button id="reset">リセット</button></div>
<table id="tbl"></table>
<div class="box" style="margin-top:10px"><b>読取履歴（新しい順）</b><div id="log"></div></div>
<script>
'use strict';
const OWN_CODE='400095140',SLIP_LENGTH=43,SLIP_TAIL='S3',J_LENGTH=152,GS1_MIN_LENGTH=120,STATE_KEY='slipCheck7';
function normalize(value){return String(value).replace(/[０-９Ａ-Ｚａ-ｚ－]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[ー―‐]/g,'-').replace(/\u3000/g,' ').replace(/[\x00-\x1f]/g,'').replace(/^\][A-Za-z]\d/,'').trim().toUpperCase()}
function parseSlip(raw){const s=normalize(raw),m=s.match(/^[0-9A-Z]{5}([0-9A-Z]{4})([0-9A-Z]{2})(\d{6})([0-9A-Z]{2})[A-Z]/);if(!m)return null;const date='20'+m[3],tail=s.match(/(20\d{6})([0-9A-Z]{2})S3$/);return{valid:s.length===SLIP_LENGTH&&s.endsWith(SLIP_TAIL),length:s.length,tail:s.slice(-2),destination:m[1],uke:m[2],date,pickupRoute:m[4],order:tail&&tail[1]===date?tail[2]:null,raw:s}}
function parseKanban(raw){const s=normalize(raw);const gs=s.match(/6V(\d{9})/);if(gs){const date=s.match(/16D(\d{8})9D/),route=s.match(/9D([0-9A-Z]{2})10K/),uke=s.match(/1L([0-9A-Z]+?)7V/);return{type:'GS1',supplier:gs[1],date:date?date[1]:'',pickupRoute:route?route[1]:null,order:null,uke:uke?uke[1]:'',complete:s.length>=GS1_MIN_LENGTH&&/P\d{5}-\d{5}-\d{2}Q\d/.test(s),key:s}}
 if(/^J[HTYM]/.test(s)){const fields=s.split(/\s+/),receive=fields[1]||'',seq=s.match(/(?:^|\s)(10\d{4})([0-9A-Z]{2})([0-9A-Z]{2})(20\d{6})([0-9A-Z]{2})(?=\s|$)/);return{type:s.slice(0,2),supplier:'',date:seq?seq[4]:'',pickupRoute:seq?seq[2]:null,order:seq?seq[5]:null,uke:receive.length>=2?receive.slice(-2):'',complete:s.length===J_LENGTH,key:s}}
 return null}
const sameSlip=(a,b)=>!!a&&!!b&&a.raw.slice(0,20)===b.raw.slice(0,20)&&a.raw.slice(23)===b.raw.slice(23);
const $=id=>document.getElementById(id),empty=()=>({head:null,total:0,started:false,seen:[],log:[]});
let state;try{state=JSON.parse(localStorage.getItem(STATE_KEY)||'null')}catch(e){state=null}let st=state&&Array.isArray(state.seen)&&Array.isArray(state.log)?state:empty();
const save=()=>localStorage.setItem(STATE_KEY,JSON.stringify(st)),count=()=>st.seen.length,fmtDate=d=>d?`${d.slice(0,4)}/${d.slice(4,6)}/${d.slice(6)}`:'－';
// 音：OK=高音短く1回／NG=低音長く1回／対象外=中音短く2回
const SOUND={ok:[[1450,0,.1]],ng:[[300,0,.55]],skip:[[700,0,.08],[700,.15,.08]]};
let audio;function beep(kind){try{audio=audio||new AudioContext();if(audio.state==='suspended')audio.resume();for(const [hz,at,len] of SOUND[kind]){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=hz;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+at);o.stop(audio.currentTime+at+len)}}catch(e){}}
function show(type,message){$('status').className=type;$('status').textContent=message}
function addLog(result,reason,k,raw){st.log.unshift({time:new Date().toLocaleString('ja-JP'),result,reason,format:k?k.type:'',uke:k?k.uke:'',date:k?k.date:'',pickupRoute:k?k.pickupRoute||'':'',order:k?k.order||'':'',raw:normalize(raw)});st.log=st.log.slice(0,5000)}
function render(){const h=st.head||{};$('dest').textContent=h.destination||'－';$('date').textContent=fmtDate(h.date);$('route').textContent=h.pickupRoute||'－';$('order').textContent=h.order||(st.head?'QRに情報なし':'－');$('uke').textContent=h.uke||'－';$('totalView').textContent=st.total;$('setup').querySelectorAll('button').forEach(b=>b.disabled=st.started);$('left').textContent=st.started?`残 ${st.total-count()} 箱`:'';$('progress').textContent=st.started?`読取 ${count()} / ${st.total} 箱`:'';$('tbl').innerHTML=st.started?`<tr><th>照合状況</th><th>読取箱数</th><th>残数</th></tr><tr><td>${count()===st.total?'完了':'照合中'}</td><td>${count()}</td><td>${st.total-count()}</td></tr>`:'';$('log').innerHTML=st.log.slice(0,50).map(l=>`<div class="${l.result==='OK'?'':l.result==='対象外'?'':'bad'}">${l.time}　${l.result}　${l.reason}</div>`).join('')}
function reject(reason,k,raw){addLog('NG',reason,k,raw);save();render();beep('ng');show('ng','NG：'+reason)}
function skip(reason,raw){addLog('対象外',reason,null,raw);save();render();beep('skip');show('skip',reason+'（数えません）')}
function acceptSlip(h,raw){if(!h.valid)return reject(`指示書QRの形式が想定と異なります（${h.length}文字・末尾${h.tail}）`,null,raw);if(st.head){if(st.head.raw===h.raw)return skip('読込済みの指示書',raw);if(sameSlip(st.head,h))return skip(`同じ指示書の別ページ（${h.raw.slice(20,23)}）`,raw);return reject('別の指示書です。切替時はリセットしてください',null,raw)}st.head=h;addLog('指示書','',null,raw);save();render();beep('ok');show('ok',`指示書読込：${fmtDate(h.date)}　引取り便${h.pickupRoute}　オーダー${h.order||'なし'}　受入${h.uke}`)}
function onScan(raw){const s=normalize(raw);if(!s)return;const slip=parseSlip(s);if(slip){if(st.started)return sameSlip(st.head,slip)?skip('読込済みの指示書',raw):reject('照合中に別の指示書QRを読みました（切替時はリセット）',null,raw);return acceptSlip(slip,raw)}if(!st.started){return reject(st.head?'総箱数を設定して「照合開始」を押してください':'先に指示書の左上QRを読んでください',null,raw)}const k=parseKanban(s);if(!k)return skip('対象外のコード',raw);if(!k.complete)return reject(`QRが途中で切れています（${k.key.length}文字）。もう一度読んでください`,k,raw);if(!k.date||!k.uke)return reject('かんばんから納入日または受入を読み取れません',k,raw);const h=st.head;if(k.type==='GS1'&&k.supplier!==OWN_CODE)return reject(`自社コード違い（${k.supplier}）`,k,raw);if(k.date!==h.date)return reject(`納入日違い（かんばん${k.date}／指示書${h.date}）`,k,raw);if(k.uke!==h.uke)return reject(`受入違い（かんばん${k.uke}／指示書${h.uke}）`,k,raw);if(h.pickupRoute&&!k.pickupRoute)return reject('かんばんから引取り便を読み取れません',k,raw);if(h.order&&k.type!=='GS1'&&!k.order)return reject('かんばんからオーダーを読み取れません',k,raw);if(h.pickupRoute&&k.pickupRoute!==h.pickupRoute)return reject(`引取り便違い（かんばん${k.pickupRoute}／指示書${h.pickupRoute}）`,k,raw);if(h.order&&k.order&&k.order!==h.order)return reject(`オーダー違い（かんばん${k.order}／指示書${h.order}）`,k,raw);if(st.seen.some(x=>x===k.key||x.startsWith(k.key)||k.key.startsWith(x)))return reject('同じQRの二重読み',k,raw);if(count()>=st.total)return reject(`総箱数超過（指示書は${st.total}箱）`,k,raw);st.seen.push(k.key);addLog('OK','',k,raw);save();render();beep('ok');if(count()===st.total)show('done',`照合完了：全${st.total}箱そろいました`);else show('ok',`OK　読取 ${count()} / ${st.total} 箱　残 ${st.total-count()} 箱`)}
function changeTotal(delta){if(st.started)return;st.total=Math.max(0,Math.min(999,st.total+delta));$('totalView').textContent=st.total;save()}
document.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>changeTotal(+b.dataset.step)));$('clear').onclick=()=>changeTotal(-st.total);
$('start').onclick=()=>{if(!st.head)return alert('先に指示書の左上QRを読んでください');if(!st.total)return alert('総箱数を設定してください');st.started=true;save();render();document.activeElement.blur();show('','照合中：中央QRを順不同で読み取ってください')};
$('reset').onclick=()=>{if(st.started&&!confirm('照合データを消してリセットしますか？'))return;st=empty();save();render();show('','指示書の左上QRを読んでください')};
$('csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/[\x00-\x1f]/g,'').replace(/"/g,'""')+'"',h=st.head||{},rows=[['納入先コード',h.destination||'','納入日',h.date||'','引取り便',h.pickupRoute||'','オーダー',h.order||'','受入',h.uke||''],[],['時刻','結果','理由','形式','受入','納入日','引取り便','オーダー','QR全文'],...st.log.slice().reverse().map(x=>[x.time,x.result,x.reason,x.format,x.uke,x.date,x.pickupRoute,x.order,x.raw])];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download=`照合_${h.date||'未設定'}_${h.pickupRoute||''}便.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
let buffer='',lastKey=0,timer;function flush(){clearTimeout(timer);const value=buffer;buffer='';if(value)onScan(value);waitMsg()}document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='Process'){e.preventDefault();show('ng','入力モードを半角英数にしてください');return}const now=Date.now();if(now-lastKey>300)buffer='';lastKey=now;if(e.key==='Enter'||(e.key==='Tab'&&buffer)){e.preventDefault();flush();return}if(e.key.length===1&&!e.ctrlKey&&!e.altKey){e.preventDefault();buffer+=e.key;$('wait').textContent=`受信中：${buffer.length}文字`;clearTimeout(timer);timer=setTimeout(()=>{if(buffer.length>=10)flush();else buffer=''},250)}});
function waitMsg(){$('wait').textContent=document.activeElement.matches('input,textarea')?'入力欄にカーソルがあります':'● スキャン待機中'}document.addEventListener('focusin',waitMsg);document.addEventListener('focusout',()=>setTimeout(waitMsg));window.addEventListener('blur',()=>$('wait').textContent='⚠ この画面を選択してからスキャンしてください');window.addEventListener('focus',waitMsg);
// クリック後にボタンへフォーカスが残ると、スキャナーの空白・Enterで誤作動するため外す
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>b.blur()));
render();waitMsg();if(st.started)show('','照合中（前回の続き）：中央QRを読み取ってください');
</script></body></html>
